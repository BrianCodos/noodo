name: Publish NOODO to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure public Mapbox token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.MAPBOX_PUBLIC_TOKEN || '';
          if (token && !token.startsWith('pk.')) throw new Error('Use a public Mapbox token (pk.).');
          fs.writeFileSync('dist/mapbox-config.js', 'window.NOODO_MAPBOX = ' + JSON.stringify({accessToken: token, style: 'mapbox://styles/mapbox/dark-v11'}) + ';\n');
          NODE
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          node <<'NODE'
          (async () => {
            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
            for (let attempt = 0; attempt < 20; attempt++) {
              const response = await fetch(url, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
              if (!response.ok) throw new Error(`Artifact lookup failed: ${response.status}`);
              const data = await response.json();
              if (data.artifacts.some(item => item.name === process.env.ARTIFACT_NAME && !item.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('The uploaded Pages artifact is not visible yet. Retry this deployment.');
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
