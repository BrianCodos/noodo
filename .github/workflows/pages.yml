name: Publish NOODO to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure public Mapbox token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.MAPBOX_PUBLIC_TOKEN || '';
          if (token && !token.startsWith('pk.')) throw new Error('Use a public Mapbox token (pk.).');
          fs.writeFileSync('dist/mapbox-config.js', 'window.NOODO_MAPBOX = ' + JSON.stringify({accessToken: token, style: 'mapbox://styles/mapbox/dark-v11'}) + ';\n');
          NODE
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
